<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>StarUML API Generation</title>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script></head>
<script type="text/javascript">
    $(document).ready(function() {
        $("#buttonSubmit").click(function() {
            var fd = new FormData();
            var files = $('#file')[0].files[0];
            fd.append('file', files);
 
            $.ajax({
                url: '/ui/uploadInfoModel',
                type: 'post',
                data: fd,
                contentType: false,
                processData: false,
                success: function(response){
                    if(response != 0){
						alert('file uploaded');
                    } else {
						alert('file not uploaded');
                    }
                },
                error: function(jqXHR, textStatus, errorThrown) {
                	alert('error uploading - textStatus:' + textStatus + " errorThrown:" + errorThrown);
                }
            });
            return false;
        });
    });
</script>
<body>
	<form enctype="multipart/form-data">
		StarUML File: <input id="file" type="file" />
		<button id="buttonSubmit">Upload</button>
	</form>
</body>
</html>
